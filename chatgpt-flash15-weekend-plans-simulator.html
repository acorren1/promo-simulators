<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>ChatGPT Weekend Plans Simulator</title>
  <style>
    :root{--bg:#fff;--line:#e5e5e7;--text:#202123;--green:#10a37f;--user:#f4f4f5}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--text)}
    .phone{width:100%;height:100%;max-width:520px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
    .status{height:44px;padding:8px 17px 0;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;background:#fff;z-index:20;position:relative}.status-right{display:flex;align-items:center;gap:7px}.status svg{display:block}
    .topbar{height:58px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 10px;background:#fff;position:relative;z-index:15}.iconbtn{display:flex;align-items:center;justify-content:center}.iconbtn svg{width:23px;height:23px}.title{text-align:center;font-size:17px;font-weight:700}.subtitle{display:block;font-size:11px;color:#8e8e93;font-weight:500;margin-top:1px}
    .chat{position:absolute;top:102px;left:0;right:0;bottom:78px;overflow-y:auto;padding:14px 14px 28px;scroll-behavior:smooth;background:#fff}.msg{display:flex;gap:10px;margin:0 0 18px;opacity:0;transform:translateY(8px)}.msg.show{animation:rise .3s ease forwards}@keyframes rise{to{opacity:1;transform:translateY(0)}}.msg.user{justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}.avatar.ai{background:#111;color:#fff}.avatar.user{background:#dfe7ff;color:#2d4f9c}.bubble{max-width:82%;font-size:16px;line-height:1.48;white-space:pre-wrap}.user .bubble{background:var(--user);border-radius:18px 18px 5px 18px;padding:10px 13px}.ai .bubble{padding-top:3px}
    .thinking{display:flex;align-items:center;gap:7px;color:#6b6b70;font-size:14px;margin-top:4px}.dot{width:6px;height:6px;border-radius:50%;background:#7f7f85;animation:bounce 1.1s infinite ease-in-out}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
    .checklist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}.checklist li{display:flex;align-items:center;gap:8px;color:#4a4a4d;font-size:14px}.check{width:18px;height:18px;border-radius:50%;background:#e8f7f2;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
    .stats{margin-top:10px;display:grid;gap:7px}.stat{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;background:#f8f8f9;border:1px solid #ededee;border-radius:10px;font-size:14px}.stat b{font-weight:750}.bad{color:#c2410c}.good{color:#0f8a6a}
    .answer-title{font-size:24px;font-weight:850;letter-spacing:-.7px;margin:12px 0 8px}.location-list{display:grid;gap:8px;margin-top:10px}.location{background:#f8f8f9;border:1px solid #ececee;border-radius:12px;padding:10px 11px}.location b{display:block;font-size:15px}.location span{display:block;color:#6e6e73;font-size:13px;margin-top:2px}
    .confidence{margin-top:12px;background:#f8f8f9;border-radius:12px;padding:11px;border:1px solid #ececee}.confidence-top{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.bar{height:8px;background:#e7e7e9;border-radius:8px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;width:0;background:var(--green);border-radius:8px;transition:width 1s ease}.promo{margin-top:12px;border:1px solid #cfeee4;background:#effaf6;border-radius:14px;padding:12px}.promo strong{display:block;font-size:18px;color:#087a5e;margin-bottom:4px}.promo span{font-size:14px;color:#365d51}
    .composer{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:1px solid var(--line);background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:flex-start;gap:9px;z-index:20}.input{flex:1;height:44px;border:1px solid #d9d9dc;border-radius:22px;padding:11px 14px;font-size:15px;color:#8e8e93;background:#fff}.send{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;margin-top:2px}.send svg{width:19px;height:19px}
    .controls{position:absolute;right:12px;top:110px;display:flex;gap:8px;z-index:40}.controls button{border:0;border-radius:18px;padding:8px 12px;font-weight:800;font-size:13px;background:#111;color:#fff;opacity:.9}.start-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:28px}.start-card{width:min(360px,100%);background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.25)}.start-card h1{font-size:24px;margin:0 0 8px}.start-card p{font-size:15px;line-height:1.4;color:#555;margin:0 0 18px}.start-card button{border:0;background:#111;color:#fff;font-size:17px;font-weight:850;padding:12px 22px;border-radius:24px}.hint{font-size:12px;color:#777;margin-top:12px}.typing-cursor{display:inline-block;width:2px;height:18px;background:#222;vertical-align:-3px;margin-left:2px;animation:blink .8s infinite}@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
    @media (min-width:521px){body{padding:18px}.phone{height:calc(100vh - 36px);border-radius:30px;box-shadow:0 10px 50px rgba(0,0,0,.5)}}
  </style>
</head>
<body>
<main class="phone">
  <div class="status"><div id="clock">10:12</div><div class="status-right">
    <svg width="19" height="13" viewBox="0 0 19 13"><rect x="0" y="8" width="3" height="5" rx="1" fill="#000"/><rect x="5" y="6" width="3" height="7" rx="1" fill="#000"/><rect x="10" y="3" width="3" height="10" rx="1" fill="#000"/><rect x="15" y="0" width="3" height="13" rx="1" fill="#000"/></svg>
    <svg width="18" height="14" viewBox="0 0 20 15"><path d="M1.5 4.6C6.4.6 13.6.6 18.5 4.6" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/><path d="M4.8 8.1c3-2.4 7.4-2.4 10.4 0" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/><path d="M8 11.3c1.2-.9 2.8-.9 4 0" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="13.2" r="1.25" fill="#000"/></svg>
    <svg width="27" height="13" viewBox="0 0 30 14"><rect x="1" y="1" width="25" height="12" rx="3" fill="none" stroke="#000" stroke-width="1.4"/><rect x="3" y="3" width="17" height="8" rx="1.8" fill="#000"/><rect x="27" y="4.2" width="2" height="5.6" rx="1" fill="#000"/></svg>
  </div></div>
  <div class="topbar"><div class="iconbtn"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="title">ChatGPT<span class="subtitle">Weekend Plans Consultant</span></div><div class="iconbtn"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div></div>
  <section id="chat" class="chat"></section>
  <div class="composer"><div class="input">Message ChatGPT</div><div class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-5 5m5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  <div class="controls"><button id="replayBtn">Replay</button><button id="hideBtn">Hide controls</button></div>
  <div id="startOverlay" class="start-overlay"><div class="start-card"><h1>ChatGPT Promo Simulator</h1><p>Tap start and screen-record. The answer streams in, roasts the group, and lands on the escape room promo.</p><button id="startBtn">Start conversation</button><div class="hint">Hide controls before recording. Double-tap to bring them back.</div></div></div>
</main>
<script>
const chat=document.getElementById('chat'),controls=document.querySelector('.controls'),overlay=document.getElementById('startOverlay');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function updateClock(){const d=new Date();let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0');h=h%12||12;document.getElementById('clock').textContent=`${h}:${m}`}updateClock();
function scrollBottom(){requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
function addMessage(type,content){const row=document.createElement('div');row.className=`msg ${type}`;row.innerHTML=type==='user'?`<div class="bubble">${content}</div><div class="avatar user">A</div>`:`<div class="avatar ai">✦</div><div class="bubble">${content}</div>`;chat.appendChild(row);requestAnimationFrame(()=>row.classList.add('show'));scrollBottom();return row}
function addThinking(){return addMessage('ai',`<div class="thinking"><span>Thinking</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`)}
async function typeInto(el,text,speed=28){el.innerHTML=`<span class="streamText"></span><span class="typing-cursor"></span>`;const target=el.querySelector('.streamText');for(const ch of text){target.textContent+=ch;scrollBottom();await sleep(speed+Math.random()*18)}el.querySelector('.typing-cursor')?.remove()}
let playing=false;async function play(){if(playing)return;playing=true;chat.innerHTML='';await sleep(350);addMessage('user','What should four adults do this weekend?');await sleep(900);let t=addThinking();await sleep(1600);t.remove();const ai1=addMessage('ai','');await typeInto(ai1.querySelector('.bubble'),'I can help with that. First, I need to assess the group dynamic.',26);await sleep(650);const checklist=document.createElement('ul');checklist.className='checklist';checklist.innerHTML='<li><span class="check">✓</span> Weather checked</li><li><span class="check">✓</span> Budget considered</li><li><span class="check">✓</span> Travel time considered</li><li><span class="check">✓</span> Group indecisiveness detected</li>';ai1.querySelector('.bubble').appendChild(checklist);scrollBottom();await sleep(1050);addMessage('ai','Quick question: will at least one person say “I don’t care”?');await sleep(950);addMessage('user','Yes.');await sleep(800);addMessage('ai','And will that same person reject every suggestion?');await sleep(950);addMessage('user','Also yes.');await sleep(900);t=addThinking();await sleep(1500);t.remove();const ai2=addMessage('ai','');await typeInto(ai2.querySelector('.bubble'),'Understood. Recalculating based on advanced friend-group dysfunction...',25);await sleep(700);const stats=document.createElement('div');stats.className='stats';stats.innerHTML='<div class="stat"><b>Dinner</b><span class="bad">12% chance of agreement</span></div><div class="stat"><b>Bowling</b><span class="bad">19% chance of agreement</span></div><div class="stat"><b>Brewery</b><span class="bad">24% chance of agreement</span></div><div class="stat"><b>Arguing in the parking lot</b><span class="good">96% chance</span></div>';ai2.querySelector('.bubble').appendChild(stats);scrollBottom();await sleep(1400);const ai3=addMessage('ai','');await typeInto(ai3.querySelector('.bubble'),'Optimal recommendation:',28);const title=document.createElement('div');title.className='answer-title';title.textContent='Escape Room';ai3.querySelector('.bubble').appendChild(title);const locs=document.createElement('div');locs.className='location-list';locs.innerHTML='<div class="location"><b>Big Screen Escapes</b><span>Mt. Pocono</span></div><div class="location"><b>Big Screen Escapes</b><span>Tannersville</span></div><div class="location"><b>Klues Escape Room</b><span>Stroudsburg</span></div><div class="location"><b>Nevermind Escape Rooms</b><span>Scranton</span></div>';ai3.querySelector('.bubble').appendChild(locs);scrollBottom();await sleep(900);const conf=document.createElement('div');conf.className='confidence';conf.innerHTML='<div class="confidence-top"><span>Confidence</span><span>99.8%</span></div><div class="bar"><span></span></div>';ai3.querySelector('.bubble').appendChild(conf);scrollBottom();await sleep(150);conf.querySelector('.bar span').style.width='99.8%';await sleep(1100);const promo=document.createElement('div');promo.className='promo';promo.innerHTML='<strong>Use code FLASH15 for 15% off this weekend.</strong><span>Four locations. One decision. Finally.</span>';ai3.querySelector('.bubble').appendChild(promo);scrollBottom();await sleep(1300);addMessage('user','What if they still can’t decide?');await sleep(950);t=addThinking();await sleep(850);t.remove();const final=addMessage('ai','');await typeInto(final.querySelector('.bubble'),'Start without them.',42);playing=false}
document.getElementById('startBtn').addEventListener('click',async()=>{overlay.style.display='none';await play()});document.getElementById('replayBtn').addEventListener('click',play);document.getElementById('hideBtn').addEventListener('click',()=>controls.style.display='none');document.addEventListener('dblclick',()=>controls.style.display='flex');
</script>
</body>
</html>
